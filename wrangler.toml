#:schema node_modules/wrangler/config-schema.json
name = "aisso"
main = "workers/app.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2025-03-28"
send_metrics = false

# --- Hébergement : Worker pur + assets statiques (remplace pages_build_output_dir) ---
[assets]
directory = "./build/client"
binding = "ASSETS"

# --- Conteneurs (payants) totalement retires de l'app le 18/08 : plus aucun
# Service Binding necessaire ici. Le Worker "aisso-con" (ex-container-worker)
# n'est donc plus appele par cette app et peut etre supprime sur Cloudflare
# si besoin, sans impact.
