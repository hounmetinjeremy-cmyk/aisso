#:schema node_modules/wrangler/config-schema.json
name = "aisso"
main = "workers/app.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2025-03-28"
send_metrics = false

# --- Hébergement : Worker pur + assets statiques (remplace pages_build_output_dir) ---
[assets]
directory = "./build/client"
binding = "ASSETS"

# --- Phase 2 : conteneur distant DEPLACE dans un Worker separe (aisso-container) ---
# Le bloc [[containers]] a ete retire d'ici : combine avec l'enorme graphe de
# dependances de cette app (IA SDKs, CodeMirror...), il faisait planter le
# bundler wrangler de facon differente selon la version testee (voir historique
# des commits). Ce Worker principal parle maintenant au Worker isole
# "aisso-container" via ce Service Binding.
[[services]]
binding = "CONTAINER_SERVICE"
service = "aisso-container"
