#:schema node_modules/wrangler/config-schema.json
name = "aisso"
main = "workers/app.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2026-08-15"
send_metrics = false

# --- Hébergement : Worker pur + assets statiques (remplace pages_build_output_dir) ---
[assets]
directory = "./build/client"
binding = "ASSETS"

# --- Phase 2 : Cloudflare Container pour le terminal/build distant ---
# Activé : Workers Builds construit l'image Docker côté serveur au déploiement
# (pas besoin de Docker en local / sur mobile).
[[containers]]
class_name = "UserContainer"
image = "./container/Dockerfile"
max_instances = 5
instance_type = "standard"

[[durable_objects.bindings]]
name = "USER_CONTAINER"
class_name = "UserContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserContainer"]
# trigger rebuild: try recent compatibility_date to fix wrangler's internal
# "Could not resolve sqlite" bundling bug (node builtin externalization list
# may have been updated in newer Workers runtime versions since March 2025).
