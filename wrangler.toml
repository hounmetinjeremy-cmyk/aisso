#:schema node_modules/wrangler/config-schema.json
name = "aisso"
main = "workers/app.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2025-03-28"
send_metrics = false

# --- Hébergement : Worker pur + assets statiques (remplace pages_build_output_dir) ---
[assets]
directory = "./build/client"
binding = "ASSETS"

# --- Phase 2 : Cloudflare Container pour le terminal/build distant ---
# Activé : Workers Builds construit l'image Docker côté serveur au déploiement
# (pas besoin de Docker en local / sur mobile).
[[containers]]
class_name = "UserContainer"
image = "./container/Dockerfile"
max_instances = 5
instance_type = "standard"

[[durable_objects.bindings]]
name = "USER_CONTAINER"
class_name = "UserContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserContainer"]
# Combo confirmee fonctionnelle : wrangler 4.44.0 + compatibility_date 2025-03-28
# (deploiement reussi le 17/08 22:13 UTC). La combo wrangler 4.123.0 + date
# recente (2026-08-15) plante silencieusement (~9s dans le deploy, probable OOM
# du bundler wrangler face au tres gros graphe de dependances IA/codemirror).
