name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

# Ne jamais annuler un déploiement en cours : on met en file, on n'interrompt pas.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check if deployment is configured
        id: check-secrets
        run: |
          if [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" && -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup and Build
        if: steps.check-secrets.outputs.configured == 'true'
        uses: ./.github/actions/setup-and-build

      - name: Deploy to Cloudflare Workers
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Deployment not configured
        if: steps.check-secrets.outputs.configured == 'false'
        run: |
          echo "::error::Déploiement Cloudflare non configuré."
          echo "Ajoute les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID"
          echo "dans Settings > Secrets and variables > Actions de ce dépôt."
          exit 1
